# Serves the built Studio and proxies /api to the FastAPI backend (same origin, no CORS).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    client_max_body_size 1m;

    # Security headers (also sent by the API for /api responses).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API, including the chat SSE stream.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Server-Sent Events: forward tokens as they arrive, keep long runs open.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Knowledge document uploads (the API enforces KNOWLEDGE_MAX_UPLOAD_BYTES).
    location /api/knowledge/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 11m;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        # `expires` (not add_header) so the server-level security headers still apply.
        expires max;
        try_files $uri =404;
    }

    # Single-page app: unknown paths render index.html (client-side routing).
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
