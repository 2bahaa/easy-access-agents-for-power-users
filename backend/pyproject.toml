[project]
name = "easy-access-agents"
version = "0.1.0"
description = "Agent Studio backend: FastAPI + LangGraph runtime"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1",
    "asyncpg>=0.32.0",
    "cryptography>=44",
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "jsonschema>=4.23",
    "langchain-anthropic>=1.0",
    "langchain-google-genai>=3.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.2.22",
    "mcp>=1.9",
    "opentelemetry-api>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-sdk>=1.30",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.10",
    "pypdf>=5.1",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S"]
# Test credentials are fixtures, not secrets.
"tests/**" = ["S105", "S106", "S107"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["scripts/", "alembic/"]

[[tool.mypy.overrides]]
module = ["langchain_ollama.*", "langgraph.*", "asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
